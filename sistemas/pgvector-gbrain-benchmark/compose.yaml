services:
  pgvector:
    image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: ivs_benchmark
      POSTGRES_USER: ivs_benchmark
      POSTGRES_PASSWORD: ${IVS_BENCH_DB_PASSWORD:?IVS_BENCH_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivs_benchmark -d ivs_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 20
